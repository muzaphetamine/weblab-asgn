<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>My Image Gallery</title>
</head>

<body>
    <main class="desk">
        <!-- BOOK -->
        <div class="book" id="book">
            <!-- FRONT COVER -->
            <div class="hard-cover" id="frontCover">
            </div>


            <!--SHEETS-->
            <div class="page">
                <img src="images/page1.jpg" alt="Gallery page 1">
                <img src="images/page2.jpg" alt="Gallery page 2">
            </div>

            <div class="page">
                <img src="images/page3.jpg" alt="Gallery page 3">
                <img src="images/page4.jpg" alt="Gallery page 4">
            </div>

            <div class="page">
                <img src="images/page5.jpg" alt="Gallery page 5">
                <img src="images/page6.jpg" alt="Gallery page 6">
            </div>

            <div class="page">
                <img src="images/page7.jpg" alt="Gallery page 7">
                <img src="images/page8.jpg" alt="Gallery page 8">
            </div>

            <div class="page">
                <img src="images/page9.jpg" alt="Gallery page 9">
                <img src="images/page10.jpg" alt="Gallery page 10">
            </div>

            <div class="page">
                <img src="images/page11.jpg" alt="Gallery page 11">
                <img src="images/page12.jpg" alt="Gallery page 12">
            </div>


            <!-- BACK COVER -->
            <div class="hard-cover back-cover">
            </div>
        </div>
        <button id="closeBook" class="close-button">
            CLOSE BOOK
        </button>
    </main>
    <script src="script.js"></script>
</body>

</html>
