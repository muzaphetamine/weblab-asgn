<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>My Image Gallery</title>
</head>

<body>
    <!-- WOODEN BACKGROUND IS ALREADY ON BODY -->
    <main class="desk">
        <!-- BOOK -->
        <div class="book" id="book">

            <!-- FRONT COVER -->
            <div class="hard-cover" id="frontCover">
            </div>


            <!-- PAGE 1 -->
            <div class="page">
                <img src="images/page1.jpg" alt="Gallery page 1">
                <img src="images/page2.jpg" alt="Gallery page 2">
            </div>
            <!-- PAGE 2 -->
            <div class="page">
                <img src="images/page3.jpg" alt="Gallery page 3">
                <img src="images/page4.jpg" alt="Gallery page 4">
            </div>
            <!-- PAGE 3 -->



            <!-- BACK COVER -->
            <div class="hard-cover back-cover">
            </div>

        </div>

        <!-- CLOSE BOOK BUTTON -->
        <button id="closeBook" class="close-button">
            CLOSE BOOK
        </button>
    </main>
    <script src="script.js"></script>
</body>

</html>
