<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>My Image Gallery</title>
</head>

<body>
    <!-- WOODEN BACKGROUND IS ALREADY ON BODY -->
    <main class="desk">
        <!-- BOOK -->
        <div class="book" id="book">

            <!-- FRONT COVER -->
            <div class="hard-cover" id="frontCover">
                <div class="cover-design">
                    <h1>MY IMAGE GALLERY</h1>
                    <p>A COLLECTION OF MEMORIES</p>
                </div>
            </div>


            <!-- PAGE 1 -->
            <div class="page">
                <img src="images/page1-front.jpg" alt="Gallery page 1">
                <img src="images/page1-back.jpg" alt="Gallery page 2">
            </div>
            <!-- PAGE 2 -->
            <div class="page">
                <img src="images/page2-front.jpg" alt="Gallery page 3">
                <img src="images/page2-back.jpg" alt="Gallery page 4">
            </div>
            <!-- PAGE 3 -->
            <div class="page">
                <img src="images/page3-front.jpg" alt="Gallery page 5">
                <img src="images/page3-back.jpg" alt="Gallery page 6">
            </div>
            <!-- PAGE 4 -->
            <div class="page">
                <img src="images/page4-front.jpg" alt="Gallery page 7">
                <img src="images/page4-back.jpg" alt="Gallery page 8">
            </div>


            <!-- BACK COVER -->
            <div class="hard-cover back-cover">
                <div class="cover-design">
                    <h2>THE END</h2>
                    <p>UNTIL NEXT TIME.</p>
                </div>
            </div>

        </div>

        <!-- CLOSE BOOK BUTTON -->
        <button id="closeBook" class="close-button">
            CLOSE BOOK
        </button>
    </main>
    <script src="script.js"></script>
</body>

</html>
